function upgrade(target){
 if((target.contentVersion||0)>=3)return;
 const before=JSON.stringify(target.drugs);
 previousDefaults.forEach((prior,i)=>{
 const fresh=seed.drugs[i];let row=target.drugs.find(x=>x[0]===prior[0]||x[0]===fresh[0]);
 if(!row){target.drugs.push(structuredClone(fresh));return;}
 for(let k=1;k<14;k++)if(JSON.stringify(row[k])===JSON.stringify(prior[k]))row[k]=structuredClone(fresh[k]);
 row[0]=fresh[0];row[2]=fresh[2];row[5]=fresh[5];
 row[14]={...fresh[14],...row[14],category:fresh[14].category,offlabel:fresh[14].offlabel,timeline:row[14]?.timeline||structuredClone(fresh[14].timeline||[])};
 fresh[13].forEach(source=>{if(!row[13].some(x=>x[1]===source[1]))row[13].push(structuredClone(source));});
 target.events.forEach(e=>{if(e[1]===prior[0])e[1]=fresh[0]});
 });
 target.drugs.forEach(row=>{for(let k=1;k<12;k++)row[k]=row[k].replace(/女性\s*AGA/g,'女性 FPHL').replaceAll('Top-line results','Top-line results');});
 target.contentVersion=3;
 target.logs.push([day(),'全站','更新預設資料與分類；其他自訂內容保留。此紀錄保存升級前資料。','版本升級',before]);
}
